<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d12" />
    <title>Blood &amp; Sand — Prototype</title>
  </head>
  <body>
    <main class="game-shell" data-testid="series-phase" data-phase="season-board">
      <header class="masthead">
        <div><p class="eyebrow">House of Mars &middot; Series challenge</p><h1>Blood <span>&amp;</span> Sand</h1></div>
        <div class="controls" data-testid="runtime-controls"></div>
      </header>
      <div class="page-body" data-testid="page-body">
        <section id="season-ui" aria-label="Season overview"></section>
        <section id="series-ui" aria-label="Series management"></section>
        <section id="battle-ui" hidden>
          <div class="battle-grid" data-testid="arena-shell">
            <article data-testid="active-home"></article>
            <div class="arena" data-testid="arena"><canvas aria-label="3D gladiator arena"></canvas><h2 class="arena__status" tabindex="-1" aria-live="polite" data-testid="battle-status"></h2></div>
            <article data-testid="active-away"></article>
          </div>
        </section>
        <div class="below-arena-row" data-testid="below-arena-row">
          <section class="battle-feed" aria-label="Battle feed" hidden><div><strong>Battle feed</strong></div><ol aria-live="off" data-testid="battle-feed"></ol></section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
