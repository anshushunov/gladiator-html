<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d12" />
    <title>Blood & Sand — Prototype</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Agent-first prototype · bout 001</p>
          <h1>Blood <span>&</span> Sand</h1>
        </div>
        <div class="controls" aria-label="Battle controls">
          <button class="button button--primary" data-testid="toggle-bout">Pause bout</button>
          <button class="button" data-testid="reset-bout">Reset</button>
        </div>
      </header>

      <section class="battle-grid" aria-label="Gladiator bout">
        <article class="fighter-card fighter-card--red" data-testid="fighter-red">
          <div class="fighter-card__title">
            <span class="sigil">I</span>
            <div><small>House of Mars</small><h2>Brutus</h2></div>
            <strong data-hp="red">100</strong>
          </div>
          <div class="health"><i data-health="red"></i></div>
        </article>

        <div class="arena" data-testid="arena">
          <canvas aria-label="3D gladiator arena"></canvas>
          <div class="arena__status" aria-live="polite" data-testid="battle-status">FIGHT</div>
          <div class="arena__round">The Ludus · Exhibition Match</div>
        </div>

        <article class="fighter-card fighter-card--blue" data-testid="fighter-blue">
          <div class="fighter-card__title">
            <span class="sigil">II</span>
            <div><small>House of Neptune</small><h2>Cassius</h2></div>
            <strong data-hp="blue">100</strong>
          </div>
          <div class="health"><i data-health="blue"></i></div>
        </article>
      </section>

      <section class="battle-feed" aria-label="Battle feed">
        <div><span class="live-dot"></span><strong>Battle feed</strong></div>
        <ol data-testid="battle-feed"></ol>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
